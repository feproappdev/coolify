<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 100" fill="none">
  <!-- HOSTZONES Text -->
  <text x="280" y="65" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="2">HOSTZONES</text>
  
  <!-- Tech Icon on Left -->
  <g transform="translate(20, 10)">
    <!-- Outer Circle -->
    <circle cx="40" cy="40" r="35" stroke="#7265b5" stroke-width="3" fill="none"/>
    
    <!-- Inner Circuit Pattern -->
    <circle cx="28" cy="28" r="4" fill="#7265b5"/>
    <circle cx="52" cy="28" r="4" fill="#7265b5"/>
    <circle cx="40" cy="52" r="4" fill="#7265b5"/>
    <circle cx="25" cy="52" r="3" fill="#33d4ff"/>
    <circle cx="55" cy="52" r="3" fill="#33d4ff"/>
    
    <!-- Connection Lines -->
    <line x1="28" y1="28" x2="40" y2="52" stroke="#7265b5" stroke-width="2"/>
    <line x1="52" y1="28" x2="40" y2="52" stroke="#7265b5" stroke-width="2"/>
    <line x1="25" y1="52" x2="40" y2="52" stroke="#33d4ff" stroke-width="1.5"/>
    <line x1="55" y1="52" x2="40" y2="52" stroke="#33d4ff" stroke-width="1.5"/>
    
    <!-- Center Node -->
    <circle cx="40" cy="40" r="6" fill="#fdc438"/>
    
    <!-- Location Pins -->
    <path d="M 15 35 Q 15 30, 20 30 Q 25 30, 25 35 Q 25 42, 20 48 Q 15 42, 15 35 Z" fill="#7265b5" opacity="0.7"/>
    <path d="M 55 35 Q 55 30, 60 30 Q 65 30, 65 35 Q 65 42, 60 48 Q 55 42, 55 35 Z" fill="#7265b5" opacity="0.7"/>
